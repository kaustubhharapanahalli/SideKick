<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidekick Settings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --border-color: rgba(255, 255, 255, 0.1);
        --success: #10b981;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-image:
          radial-gradient(
            circle at top right,
            rgba(59, 130, 246, 0.1),
            transparent 40%
          ),
          radial-gradient(
            circle at bottom left,
            rgba(16, 185, 129, 0.1),
            transparent 40%
          );
      }

      .container {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      h1 {
        margin-top: 0;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--text-muted);
      }

      input[type="password"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        transition: all 0.2s ease;
        font-family: "Inter", monospace;
      }

      input[type="password"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
      }

      button {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }

      button:hover {
        background: var(--primary-hover);
      }

      button:active {
        transform: scale(0.98);
      }

      .status-message {
        margin-top: 16px;
        font-size: 13px;
        text-align: center;
        min-height: 20px;
        color: var(--success);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .status-message.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Settings</h1>
      <p>Configure Sidekick by connecting your Google Gemini API key.</p>

      <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." />
      </div>

      <button id="saveBtn">Save Configuration</button>

      <div id="status" class="status-message">Settings saved successfully!</div>
    </div>

    <script src="../scripts/options.js"></script>
  </body>
</html>
