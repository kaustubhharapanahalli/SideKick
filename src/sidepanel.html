<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidekick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- Top Header -->
  <header class="panel-header" id="panelHeader">
    <div class="header-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2">
        <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A0522D"/><stop offset="100%" stop-color="#CD853F"/></linearGradient></defs>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span>Sidekick</span>
    </div>
    <div class="header-status" id="headerStatus">
      <!-- "Analyzing..." / "Ready" / "Section 2 of 5" -->
    </div>
  </header>

  <!-- Page Title Bar -->
  <div class="page-title-bar" id="pageTitleBar">
    <div class="page-type-badge" id="pageTypeBadge">ARTICLE</div>
    <h2 class="page-title" id="pageTitle">Detecting page content...</h2>
  </div>

  <!-- Progress Bar -->
  <div class="progress-track" id="progressTrack" style="display:none;">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Main Scrollable Area -->
  <div class="panel-body" id="panelBody">

    <!-- State: Loading -->
    <div class="state-view" id="stateLoading">
      <div class="loader-spinner"></div>
      <p class="loader-text" id="loaderText">Analyzing page structure...</p>
    </div>

    <!-- State: Error -->
    <div class="state-view" id="stateError" style="display:none;">
      <div class="error-icon">⚠️</div>
      <p class="error-text" id="errorText"></p>
      <button class="btn btn-secondary" id="retryBtn">Try Again</button>
    </div>

    <!-- State: Sections Ready -->
    <div class="state-view" id="stateSections" style="display:none;">

      <!-- Section List (collapsible) -->
      <div class="section-list-container">
        <button class="section-list-toggle" id="sectionListToggle">
          <span class="toggle-icon">▾</span>
          <span>All Sections</span>
          <span class="section-count" id="sectionCount">0</span>
        </button>
        <div class="section-list" id="sectionList">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Current Section Card -->
      <div class="current-section-card" id="currentSectionCard">
        <div class="section-label" id="sectionLabel">SECTION 1</div>
        <h3 class="section-title" id="sectionTitle"></h3>
        <p class="section-summary" id="sectionSummary"></p>

        <!-- YouTube: timestamp hint -->
        <div class="timestamp-hint" id="timestampHint" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="timestampText">Watch from 0:00 to 2:30</span>
        </div>

        <!-- Mark as Reviewed -->
        <button class="btn btn-primary" id="markReviewedBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Mark as Reviewed
        </button>
      </div>

      <!-- Question Area (shown after marking reviewed) -->
      <div class="question-area" id="questionArea" style="display:none;">
        <div class="question-label">QUESTION</div>
        <p class="question-text" id="questionText"></p>
        <textarea class="answer-input" id="answerInput" placeholder="Type your answer here..." rows="3"></textarea>
        <div class="answer-actions">
          <button class="btn btn-primary" id="submitAnswerBtn">Submit</button>
          <button class="btn btn-ghost" id="revealAnswerBtn" style="display:none;">Reveal Answer</button>
        </div>
        <div class="validation-hint" id="validationHint" style="display:none;"></div>
      </div>

      <!-- Chat Area (conversational follow-up) -->
      <div class="chat-area" id="chatArea" style="display:none;">
        <div class="chat-divider">
          <span>💬 Discussion</span>
        </div>
        <div class="chat-messages" id="chatMessages">
          <!-- Messages populated by JS -->
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask a follow-up question...">
          <button class="btn btn-icon" id="chatSendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

      <!-- Next Section Button -->
      <button class="btn btn-next" id="nextSectionBtn" style="display:none;">
        Next Section →
      </button>

    </div>
    <!-- /stateSections -->

    <!-- State: Complete -->
    <div class="state-view" id="stateComplete" style="display:none;">
      <div class="complete-icon">🎓</div>
      <h3 class="complete-title">Session Complete!</h3>
      <p class="complete-text">You've reviewed all sections and answered all questions.</p>
      <button class="btn btn-primary" id="restartBtn">Start New Session</button>
    </div>

  </div>
  <!-- /panelBody -->

  <script src="../scripts/gemini_api.js"></script>
  <script src="../scripts/sidepanel.js"></script>
</body>
</html>
